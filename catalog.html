<!DOCTYPE html>
<html lang="en" data-theme="dracula">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Koruxa Items List</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.min.css" rel="stylesheet" type="text/css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        @font-face {
            font-family: 'emoji';
            src: url('https://goldenlys.github.io/Koruxa-Enhancer/assets/fonts/NotoColorEmoji.ttf') format('truetype');
        }

        body {
            font-family: 'JetBrains Mono', monospace, 'emoji';
        }

        .font-pixel {
            font-family: 'Press Start 2P', monospace;
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: translateY(8px) scale(.97);
            }
        }

        .card-pop {
            animation: pop .3s backwards;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 3px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 3px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .scroll-arrow {
            flex-shrink: 0;
            width: 22px;
            height: 22px;
            border-radius: 9999px;
            background-color: var(--fallback-b2, oklch(var(--b2) / 0.95));
            border: 1px solid var(--fallback-bc, oklch(var(--bc) / 0.2));
            color: var(--fallback-bc, oklch(var(--bc)));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            transition: opacity 0.2s, background-color 0.15s;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        }

        .scroll-arrow:hover {
            background-color: var(--fallback-b1, oklch(var(--b1)));
            border-color: var(--fallback-wa, oklch(var(--wa)));
            color: var(--fallback-wa, oklch(var(--wa)));
        }

        .scroll-arrow:disabled {
            opacity: 0 !important;
            pointer-events: none;
        }

        #cat-chips>button,
        #rar-chips>button {
            text-transform: capitalize;
        }

        @media (min-width: 640px) {
            .scroll-arrow {
                display: none !important;
            }
        }
    </style>
</head>

<body class="bg-base-300 text-base-content min-h-screen">

    <header class="sticky top-0 z-10 bg-base-100/95 backdrop-blur border-b border-base-200 px-3 sm:px-5 py-3 shadow-md">
        <div class="max-w-[1500px] mx-auto flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 sm:gap-4">
            <div>
                <h1 class="font-pixel text-secondary text-xs sm:text-sm tracking-widest drop-shadow">
                    KORUXA ITEM INDEX
                    <small class="block font-sans text-[9px] sm:text-[10px] text-base-content/60 tracking-widest mt-1">ITEM PRICES / SOURCES / ALCHEMY RATES</small>
                </h1>
            </div>
            <div class="flex gap-4 text-xs text-base-content/70">
                <div><b id="st-shown" class="text-secondary text-sm sm:text-base inline sm:block mr-1">0</b>shown</div>
                <div><b id="st-total" class="text-secondary text-sm sm:text-base inline sm:block mr-1">0</b>items</div>
            </div>
        </div>

        <div class="max-w-[1500px] mx-auto flex items-center gap-2 mt-3">
            <input type="search" id="q" placeholder="Search items…" class="input input-sm input-bordered flex-1 text-xs" />

            <select id="sort" class="select select-sm select-bordered text-xs max-w-[130px] sm:max-w-none">
                <option value="name-asc">Name A→Z</option>
                <option value="price-desc" selected>Price high→low</option>
                <option value="price-asc">Price low→high</option>
                <option value="rarity-desc">Rarity high→low</option>
                <option value="rarity-asc">Rarity low→high</option>
                <option value="category-asc">Category A→Z</option>
            </select>

            <button id="alch-btn" class="btn btn-sm btn-square btn-outline btn-secondary shrink-0" title="Alchemy conversion">
                &#9879;
            </button>
        </div>

        <div class="max-w-[1500px] mx-auto space-y-1.5 mt-3">

            <div class="flex items-start sm:items-center gap-1.5">
                <span class="text-[9px] uppercase tracking-widest text-base-content/50 shrink-0 w-16 pt-1 sm:pt-0">Sealed</span>
                <div class="flex-1 min-w-0 flex items-center gap-1">
                    <button onclick="scrollRow(this, -1)" class="scroll-arrow left-btn">&#8249;</button>
                    <div class="scroll-row flex items-center gap-2 overflow-x-auto sm:overflow-visible sm:flex-wrap no-scrollbar py-0.5 scroll-smooth flex-1" id="sealed-chips">
                        <button id="sealed-star" class="btn btn-xs btn-outline rounded-full shrink-0">&#11088;</button>
                        <button id="sealed-moon" class="btn btn-xs btn-outline rounded-full shrink-0">&#127769;</button>
                        <button id="sealed-sun" class="btn btn-xs btn-outline rounded-full shrink-0">&#9728;&#65039;</button>
                    </div>
                    <button onclick="scrollRow(this, 1)" class="scroll-arrow right-btn">&#8250;</button>
                </div>
            </div>

            <div class="flex items-start sm:items-center gap-1.5">
                <span class="text-[9px] uppercase tracking-widest text-base-content/50 shrink-0 w-16 pt-1 sm:pt-0">Category</span>
                <div class="flex-1 min-w-0 flex items-center gap-1">
                    <button onclick="scrollRow(this, -1)" class="scroll-arrow left-btn">&#8249;</button>
                    <div class="scroll-row flex items-center gap-2 overflow-x-auto sm:overflow-visible sm:flex-wrap no-scrollbar py-0.5 scroll-smooth flex-1" id="cat-chips"></div>
                    <button onclick="scrollRow(this, 1)" class="scroll-arrow right-btn">&#8250;</button>
                </div>
            </div>

            <div class="flex items-start sm:items-center gap-1.5">
                <span class="text-[9px] uppercase tracking-widest text-base-content/50 shrink-0 w-16 pt-1 sm:pt-0">Rarity</span>
                <div class="flex-1 min-w-0 flex items-center gap-1">
                    <button onclick="scrollRow(this, -1)" class="scroll-arrow left-btn">&#8249;</button>
                    <div class="scroll-row flex items-center gap-2 overflow-x-auto sm:overflow-visible sm:flex-wrap no-scrollbar py-0.5 scroll-smooth flex-1" id="rar-chips"></div>
                    <button onclick="scrollRow(this, 1)" class="scroll-arrow right-btn">&#8250;</button>
                </div>
            </div>

        </div>
    </header>

    <dialog id="alch-modal" class="modal modal-bottom sm:modal-middle">
        <div class="modal-box border border-warning/30 bg-base-200 p-5">
            <h3 class="font-pixel text-secondary text-xs mb-2">ALCHEMY PRICE BONUSES</h3>
            <p class="text-xs text-base-content/70 mb-4">
                Level bonus = "+X% level bonus" · Golden Touch = Research Institute perk.
            </p>

            <div class="form-control w-full mb-3">
                <label class="label p-1"><span class="label-text text-xs uppercase tracking-wider">Alchemy level bonus (%)</span></label>
                <input type="number" id="alch-level" min="0" step="0.1" placeholder="e.g. 35" class="input input-sm input-bordered w-full" />
            </div>

            <div class="form-control w-full mb-4">
                <label class="label p-1"><span class="label-text text-xs uppercase tracking-wider">Golden Touch (%)</span></label>
                <input type="number" id="alch-touch" min="0" step="0.1" placeholder="e.g. 3.3" class="input input-sm input-bordered w-full" />
            </div>

            <div class="modal-action">
                <button id="alch-reset" class="btn btn-sm btn-ghost">Reset</button>
                <button id="alch-save" class="btn btn-sm btn-secondary">Save</button>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop">
            <button>close</button>
        </form>
    </dialog>

    <main class="max-w-[1500px] mx-auto p-3 sm:p-5 pb-16">
        <div class="grid grid-cols-[repeat(auto-fill,minmax(180px,1fr))] sm:grid-cols-[repeat(auto-fill,minmax(280px,1fr))] gap-2 sm:gap-3" id="grid"></div>
    </main>

    <footer class="footer footer-center p-4 bg-base-100 text-base-content/60 text-[10px] border-t border-base-200">
        <aside>
            <p>KORUXA ITEMS LIST · by Nebulys</p>
        </aside>
    </footer>

    <script>
        let ITEMS = [];
        let ITEM_SOURCES = {};
        const RARITY_ORDER = { common: 0, uncommon: 1, rare: 2, epic: 3, legendary: 4, mythic: 5 };
        const RARITY_COLORS = { common: '#9ca3af', uncommon: '#50fa7b', rare: '#8be9fd', epic: '#bd93f9', legendary: '#ffb86c', mythic: '#ff5555' };
        const ICON_BASE = 'https://koruxa.com/assets/img/';

        const SEALED = { star: '⭐', moon: '🌙', sun: '☀' };
        function sealedHidden(it) {
            const n = it.name || '';
            for (const k in SEALED) if (!sealedOn[k] && n.includes(SEALED[k])) return true;
            return false;
        }

        let ALCH = { level: 0, touch: 0 };
        try { const _s = JSON.parse(localStorage.getItem('kx_vault_alch') || 'null'); if (_s && typeof _s === 'object') ALCH = { level: +_s.level || 0, touch: +_s.touch || 0 }; } catch (e) { }
        function alchActive() { return ALCH.level > 0 || ALCH.touch > 0; }
        function alchPrice(base) {
            if (!base || !alchActive()) return base;
            return Math.ceil(base * (1 + ALCH.level / 100) * (1 + ALCH.touch / 100));
        }

        const DEFAULT_CATS = ['bars', 'ore', 'gem'];
        const HIDDEN_CATS = ['event', 'scrolls'];
        const state = { q: '', sort: 'price-desc', cats: new Set(), rars: new Set() };
        let sealedOn = { sun: false, star: false, moon: false };
        try { Object.assign(sealedOn, JSON.parse(localStorage.getItem('kx_vault_sealed') || '{}')); } catch (e) { }

        function fmt(n) { return n == null ? '' : Number(n).toLocaleString('en-US'); }

        function buildSkillMap(data) {
            ITEM_SOURCES = {};

            const addSource = (itemKey, skill, category, source, minLevel, isRare = false) => {
                if (!itemKey) return;
                if (!ITEM_SOURCES[itemKey]) ITEM_SOURCES[itemKey] = [];

                const isDup = ITEM_SOURCES[itemKey].some(s => s.skill === skill && s.category === category && s.source === source && s.isRare === isRare);
                if (!isDup) {
                    ITEM_SOURCES[itemKey].push({ skill, category, source, minLevel, isRare });
                }
            };

            for (const [skillName, sub] of Object.entries(data)) {
                if (!sub || typeof sub !== 'object') continue;
                for (const [key, val] of Object.entries(sub)) {
                    if (!val || typeof val !== 'object') continue;
                    const isDirect = 'reward_item_key' in val || 'rare_item_keys' in val || 'label' in val || 'min_level' in val || 'xp' in val;
                    if (isDirect) {
                        if (val.reward_item_key) {
                            addSource(val.reward_item_key, skillName, null, val.label || key, val.min_level ?? 1, false);
                        }
                        if (Array.isArray(val.rare_item_keys)) {
                            val.rare_item_keys.forEach(rk => {
                                addSource(rk, skillName, null, val.label || key, val.min_level ?? 1, true);
                            });
                        }
                    } else {
                        for (const [actKey, act] of Object.entries(val)) {
                            if (act && typeof act === 'object') {
                                if (act.reward_item_key) {
                                    addSource(act.reward_item_key, skillName, key, act.label || actKey, act.min_level ?? 1, false);
                                }
                                if (Array.isArray(act.rare_item_keys)) {
                                    act.rare_item_keys.forEach(rk => {
                                        addSource(rk, skillName, key, act.label || actKey, act.min_level ?? 1, true);
                                    });
                                }
                            }
                        }
                    }
                }
            }
        }

        function buildChips(el, keys, set, colorOf, labelOf) {
            keys.forEach(k => {
                const c = document.createElement('button');
                const updateStyle = () => {
                    c.className = set.has(k)
                        ? 'btn btn-xs rounded-full btn-secondary shrink-0'
                        : 'btn btn-xs rounded-full btn-outline border-base-content/20 shrink-0';
                };
                updateStyle();

                const label = labelOf ? labelOf(k) : k;
                if (colorOf) {
                    c.innerHTML = `<span class="w-1.5 h-1.5 rounded-full inline-block mr-1" style="background:${colorOf(k)}"></span>${label}`;
                } else {
                    c.textContent = label;
                }

                c.onclick = () => {
                    if (set.has(k)) set.delete(k);
                    else set.add(k);
                    updateStyle();
                    render();
                };
                el.appendChild(c);
            });
        }

        document.getElementById('q').oninput = e => { state.q = e.target.value.toLowerCase(); render(); };
        document.getElementById('sort').onchange = e => { state.sort = e.target.value; render(); };

        function visible() {
            let out = ITEMS.filter(it => {
                const cat = it.category || 'uncategorized';
                const rar = it.rarity || 'common';
                if (HIDDEN_CATS.includes(cat)) return false;
                if (!state.cats.has(cat) || !state.rars.has(rar)) return false;
                if (sealedHidden(it)) return false;
                if (state.q) {
                    const terms = state.q.split(' ');
                    const searchTarget = (it.name + ' ' + (it.item_key || '')).toLowerCase();
                    if (!terms.every(t => searchTarget.includes(t))) return false;
                }
                return true;
            });
            const [field, dir] = state.sort.split('-');
            const mul = dir === 'asc' ? 1 : -1;
            out.sort((a, b) => {
                if (field === 'name') return a.name.localeCompare(b.name) * mul;
                if (field === 'category') return (a.category || '').localeCompare(b.category || '') * mul || a.name.localeCompare(b.name);
                if (field === 'price') return ((alchPrice(a.sell_price) || 0) - (alchPrice(b.sell_price) || 0)) * mul;
                if (field === 'rarity') return ((RARITY_ORDER[a.rarity] ?? 0) - (RARITY_ORDER[b.rarity] ?? 0)) * mul || a.name.localeCompare(b.name);
                return 0;
            });
            return out;
        }

        function render() {
            const grid = document.getElementById('grid');
            const items = visible();
            grid.innerHTML = '';
            if (items.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-16 text-base-content/50"><div class="text-3xl mb-2">&#129528;</div>No items match — try clearing a filter.</div>';
            }
            items.forEach((it, i) => {
                const rar = it.rarity || 'common';
                const card = document.createElement('div');
                const color = RARITY_COLORS[rar] || RARITY_COLORS.common;
                const sources = ITEM_SOURCES[it.item_key] || [];
                const hasSources = sources.length > 0;

                card.className = 'card card-compact bg-base-100 border border-base-200 card-pop p-3 text-center transition-all hover:-translate-y-1 hover:shadow-lg flex flex-row items-center justify-between gap-2';
                card.style.borderTop = `3px solid ${color}`;
                card.style.animationDelay = Math.min(i * 12, 400) + 'ms';

                const icon = it.icon
                    ? `<img src="${ICON_BASE}${it.icon.replace(/"/g, '')}" alt="" loading="lazy" class="w-12 h-12 sm:w-14 sm:h-14 mx-auto mb-1 image-pixelated filter drop-shadow" onerror="this.outerHTML='<div class=\'text-2xl sm:text-3xl leading-[48px]\'>&#129528;</div>'">`
                    : '<div class="text-2xl sm:text-3xl leading-[48px]">&#129528;</div>';

                let price;
                if (it.sell_price) {
                    const conv = alchPrice(it.sell_price);
                    const showAlch = alchActive() && conv !== it.sell_price;
                    price = `<div class="font-bold text-accent text-xs sm:text-sm mt-1">&#129689; ${fmt(it.sell_price)}</div>`
                        + (showAlch ? `<div class="text-[9px] sm:text-[10px] text-secondary font-semibold mt-0.5">&#10024;&#129689; ${fmt(conv)}</div>` : '');
                    if (showAlch) {
                        const cph = Math.round(conv * 3600 / 5.2);
                        price += `<div class="text-[9px] sm:text-[10px] text-success font-semibold mt-0.5">&#128337; ${fmt(cph)}/h</div>`;
                    }
                } else {
                    price = '<div class="text-[10px] sm:text-xs text-base-content/40 mt-1">— no value —</div>';
                }

                let sourcesHtml = '';
                if (hasSources) {
                    const itemsList = sources.map(src => {
                        const catBadge = src.category ? `<span class="opacity-60"> (${src.category})</span>` : '';
                        const rareTag = src.isRare
                            ? `<span class="badge badge-xs bg-warning/20 text-warning border-warning/30 text-[8px] px-1 font-semibold shrink-0">Rare</span>`
                            : '';
                        return `
                            <div class="bg-base-200/90 p-1.5 rounded flex items-start justify-between gap-1 border border-base-content/5 text-left" title="${src.skill}${src.category ? ' (' + src.category + ')' : ''} - ${src.source}">
                                <div class="min-w-0 flex-1 leading-tight">
                                    <div class="font-bold text-secondary text-[9px] capitalize break-words">${src.skill}${catBadge}</div>
                                    <div class="text-base-content/80 text-[8.5px] break-words mt-0.5">${src.source}</div>
                                </div>
                                <div class="flex flex-col items-end gap-0.5 shrink-0 ml-1">
                                    <span class="badge badge-xs badge-neutral text-[8px] px-1 font-mono">Lvl ${src.minLevel}</span>
                                    ${rareTag}
                                </div>
                            </div>
                        `;
                    }).join('');

                    sourcesHtml = `
                        <div class="pl-2 border-l border-base-content/10 flex flex-col gap-1 w-[58%] min-w-0 shrink-0">
                            <div class="text-[8px] uppercase tracking-wider text-base-content/40 font-bold text-left px-0.5">
                                Sources (${sources.length})
                            </div>
                            <div class="max-h-[140px] overflow-y-auto space-y-1 pr-0.5 custom-scrollbar">
                                ${itemsList}
                            </div>
                        </div>
                    `;
                }

                const leftWidth = hasSources ? 'w-[42%]' : 'w-full';

                card.innerHTML = `
                    <div class="${leftWidth} flex flex-col items-center justify-center min-w-0">
                        ${icon}
                        <div class="font-bold text-[11px] sm:text-xs leading-tight min-h-[28px] sm:min-h-[32px] flex items-center justify-center text-center break-words w-full px-1">${it.name.replace(/</g, '&lt;')}</div>
                        <div class="text-[8px] sm:text-[9px] uppercase tracking-widest mt-0.5 font-semibold" style="color:${color}">${rar}</div>
                        ${price}
                    </div>
                    ${sourcesHtml}
                `;
                grid.appendChild(card);
            });
            document.getElementById('st-shown').textContent = fmt(items.length);
            document.getElementById('st-total').textContent = fmt(ITEMS.length);
        }

        const modal = document.getElementById('alch-modal');
        const alchBtn = document.getElementById('alch-btn');

        function alchBtnState() {
            const on = alchActive();
            alchBtn.classList.toggle('btn-active', on);
        }

        alchBtn.onclick = () => {
            document.getElementById('alch-level').value = ALCH.level || '';
            document.getElementById('alch-touch').value = ALCH.touch || '';
            modal.showModal();
        };

        document.getElementById('alch-save').onclick = () => {
            ALCH.level = Math.max(0, parseFloat(document.getElementById('alch-level').value) || 0);
            ALCH.touch = Math.max(0, parseFloat(document.getElementById('alch-touch').value) || 0);
            try { localStorage.setItem('kx_vault_alch', JSON.stringify(ALCH)); } catch (e) { }
            alchBtnState(); modal.close(); render();
        };

        document.getElementById('alch-reset').onclick = () => {
            ALCH = { level: 0, touch: 0 };
            try { localStorage.removeItem('kx_vault_alch'); } catch (e) { }
            alchBtnState(); modal.close(); render();
        };

        function saveSealed() { try { localStorage.setItem('kx_vault_sealed', JSON.stringify(sealedOn)); } catch (e) { } }
        Object.keys(SEALED).forEach(k => {
            const b = document.getElementById('sealed-' + k);
            b.onclick = () => {
                sealedOn[k] = !sealedOn[k];
                b.className = sealedOn[k] ? 'btn btn-xs rounded-full btn-secondary shrink-0' : 'btn btn-xs rounded-full btn-outline border-base-content/20 shrink-0';
                saveSealed(); render();
            };
        });

        function sealedBtnsState() {
            Object.keys(SEALED).forEach(k => {
                const b = document.getElementById('sealed-' + k);
                b.className = sealedOn[k] ? 'btn btn-xs rounded-full btn-secondary shrink-0' : 'btn btn-xs rounded-full btn-outline border-base-content/20 shrink-0';
            });
        }

        function boot(loaded) {
            ITEMS = loaded;
            const allCats = new Set();
            const catCounts = {};
            ITEMS.forEach(it => {
                const c = it.category || 'uncategorized';
                if (HIDDEN_CATS.includes(c)) return;
                allCats.add(c);
                catCounts[c] = (catCounts[c] || 0) + 1;
            });
            state.cats = new Set([...allCats].filter(c => DEFAULT_CATS.includes(c)));
            Object.keys(RARITY_ORDER).forEach(r => state.rars.add(r));
            buildChips(document.getElementById('cat-chips'), [...allCats].sort(), state.cats, null, k => k + ' (' + (catCounts[k] || 0) + ')');
            buildChips(document.getElementById('rar-chips'), Object.keys(RARITY_ORDER), state.rars, k => RARITY_COLORS[k]);
            sealedBtnsState();
            alchBtnState();
            render();
        }

        Promise.all([
            fetch('assets/js/all_items.json').then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }),
            fetch('assets/js/data.json').then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        ])
            .then(([items, skillsData]) => {
                buildSkillMap(skillsData);
                boot(items);
            })
            .catch(err => {
                document.getElementById('grid').innerHTML =
                    '<div class="col-span-full text-center py-16 text-base-content/50"><div class="text-3xl mb-2">&#128274;</div>Could not load items or skills data (' + err.message + ').<br><br>' +
                    'Browsers block a double-clicked page from reading local files — run <b class="text-secondary">open.bat</b> instead.</div>';
            });

        function scrollRow(btn, direction) {
            const container = btn.parentElement.querySelector('.scroll-row');
            if (container) {
                container.scrollBy({ left: direction * 180, behavior: 'smooth' });
            }
        }

        function updateScrollArrows() {
            document.querySelectorAll('.scroll-row').forEach(row => {
                const parent = row.parentElement;
                const leftBtn = parent.querySelector('.scroll-arrow.left-btn');
                const rightBtn = parent.querySelector('.scroll-arrow.right-btn');

                if (!leftBtn || !rightBtn) return;

                const canScrollLeft = row.scrollLeft > 2;
                const canScrollRight = row.scrollLeft < (row.scrollWidth - row.clientWidth - 2);

                leftBtn.disabled = !canScrollLeft;
                rightBtn.disabled = !canScrollRight;
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.scroll-row').forEach(row => {
                row.addEventListener('scroll', updateScrollArrows);
            });
            window.addEventListener('resize', updateScrollArrows);
        });

        const originalBoot = boot;
        boot = function (loaded) {
            originalBoot(loaded);
            setTimeout(updateScrollArrows, 50);
        };
    </script>
</body>

</html>
